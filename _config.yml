title: Nguyễn Đức Hạnh
description: Làm những thứ nhỏ giúp cuộc sống dễ hơn. Full-stack dev, Go & TypeScript.
url: "https://hashcott.github.io"
baseurl: ""
lang: vi
timezone: Asia/Ho_Chi_Minh

author:
  name: Nguyễn Đức Hạnh
  github: hashcott
  email: duchanhstyle@gmail.com

# Giữ đường dẫn cũ của các bài viết
permalink: /:year-:month-:day-:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
