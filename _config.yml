title: Nguyễn Đức Hạnh
description: I build small tools that make life easier. Full-stack dev, Go and TypeScript.
url: "https://hashcott.github.io"
baseurl: ""
lang: en
timezone: Asia/Ho_Chi_Minh

author:
  name: Nguyễn Đức Hạnh
  github: hashcott
  email: duchanhstyle@gmail.com

# Keep the old post URLs
permalink: /:year-:month-:day-:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
