<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/#du-an' | relative_url }}">Dự án</a>
      <a href="{{ '/#cap-nhat' | relative_url }}">Cập nhật</a>
      <a href="{{ '/#bai-viet' | relative_url }}">Bài viết</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    <a href="https://github.com/{{ site.author.github }}">GitHub</a> ·
    <a href="mailto:{{ site.author.email }}">Email</a> ·
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </footer>
</body>
</html>
