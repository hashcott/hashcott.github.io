---
layout: default
---
<article>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
    {% if page.type == "update" %}· cập nhật{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← Về trang chủ</a></p>
