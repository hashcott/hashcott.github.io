# Projects on the home page, in display order.
# name, url and desc are required; site is the project's own page (optional).
- name: Ghostline
  url: https://github.com/hashcott/ghostline
  site: https://hashcott.github.io/ghostline/
  desc: One-click encrypted DNS (DoH/DoT/DoQ/DNSCrypt), a local proxy and per-domain rules for Windows and Linux. ~30 MB of RAM, no telemetry.

- name: GameNoLag
  url: https://github.com/hashcott/NoLag
  desc: Steadier ping for gamers in Vietnam, through community-run relays placed close to game servers.

- name: AICamPro
  url: https://github.com/hashcott/AICamPro
  desc: An AI webcam for Linux (background removal, color correction, skin smoothing, auto framing) running on AMD GPUs via ROCm. Works with Meet, Zoom and OBS.

- name: meta-ads-mcp-server
  url: https://github.com/hashcott/meta-ads-mcp-server
  desc: An MCP server for the Meta (Facebook) Ads API.

- name: freshdesk-mcp
  url: https://github.com/hashcott/freshdesk-mcp
  desc: An MCP server for Freshdesk with 194 tools, over stdio and HTTP. Works with Claude, Cursor or any MCP client.

- name: bestdns
  url: https://github.com/hashcott/bestdns
  desc: Finds the fastest and safest DNS for your network, then applies it in one step.

- name: mouse-unlock
  url: https://github.com/hashcott/mouse-unlock
  desc: Unlock your Linux screen with a secret sequence of mouse clicks. A tiny daemon written in Rust.

- name: openrouter-max-cli
  url: https://github.com/hashcott/openrouter-max-cli
  desc: A CLI for OpenRouter with long-term memory, streaming and multiple models.
